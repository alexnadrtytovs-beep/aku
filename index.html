            d: "підвищення артеріального тиску в будь-якому терміні вагітності", 
            e: "поєднання артеріальної гіпертензії, протеїнурії та набряків в будь-якому терміні вагітності" 
        }, 
        correct: ["a"] 
    },
    { 
        question: "75. Гравідограма - це:", 
        options: { 
            a: "графічний запис висоти стояння дна матки", 
            b: "запис кількості рухів плода", 
            c: "графічний запис прибавки маси тіла під час вагітності", 
            d: "графічний запис частоти серцебиття плода", 
            e: "графічний запис обводу живота" 
        }, 
        correct: ["a"] 
    },
    { 
        question: "76. Біохімічний скринінг 1-го триместру вагітності включає визначення:", 
        options: { 
            a: "АФП", 
            b: "АФП та ХГЛ", 
            c: "ХГЛ та ПАПП-А", 
            d: "АФП, естріолу та ХГЛ", 
            e: "АФП та ПАПП-А" 
        }, 
        correct: ["c"] 
    },
    { 
        question: "77. Другий прийом Леопольда дозволяє визначити наступне, КРІМ?", 
        options: { 
            a: "положення плода", 
            b: "позицію плода", 
            c: "вид позиції плода", 
            d: "оцінити тонус матки", 
            e: "характер передлеглої частини" 
        }, 
        correct: ["e"] 
    },
    { 
        question: "78. До токолітиків відносять наступні препарати, КРІМ:", 
        options: { 
            a: "блокатори кальцієвих каналів", 
            b: "спазмолітики", 
            c: "бета-адреноміметики", 
            d: "індометацин", 
            e: "атосібан" 
        }, 
        correct: ["b"] 
    },
    { 
        question: "79. Активне ведення третього періоду пологів передбачає введення оксітоцину?", 
        options: { 
            a: "10 ОД", 
            b: "5 ОД", 
            c: "20 ОД", 
            d: "оксітоцин не вводять", 
            e: "2 ОД" 
        }, 
        correct: ["a"] 
    },
    { 
        question: "80. Вагітна 38 тижнів двійнею, передлегла частина першого плоду тазовий кінець, другого плоду – голівка. Визначте тактику ведення пологів:", 
        options: { 
            a: "пологи через природні пологові шляхи", 
            b: "плановий кесарський розтин", 
            c: "поворот плоду за Архангельським", 
            d: "стимуляція пологової діяльності", 
            e: "за бажанням жінки" 
        }, 
        correct: ["b"] 
    } 
    
        ];

        let currentQ = 0;
        let score = 0;
        let errors = [];
        let isAnswered = false;
        let userSelect = [];

        function loadQ() {
            isAnswered = false;
            userSelect = [];
            document.getElementById('feedback-container').style.display = 'none';
            document.getElementById('main-btn').innerText = "Перевірити";
            document.getElementById('main-btn').disabled = true;
            
            const q = quizData[currentQ];
            document.getElementById('question-counter').innerText = `Питання ${currentQ + 1} з ${quizData.length}`;
            document.getElementById('question-text').innerText = q.question;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            const type = q.correct.length > 1 ? 'checkbox' : 'radio';
            
            for (let key in q.options) {
                const item = document.createElement('div');
                item.className = 'option-item';
                item.innerHTML = `
                    <input type="${type}" id="${key}" name="opt">
                    <label>${key}) ${q.options[key]}</label>
                `;
                item.onclick = () => selectOpt(item, key, type);
                container.appendChild(item);
            }
        }

        function selectOpt(item, key, type) {
            if (isAnswered) return;
            if (type === 'radio') {
                userSelect = [key];
                document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
                item.classList.add('selected');
                document.querySelectorAll('input').forEach(i => i.checked = false);
                item.querySelector('input').checked = true;
            } else {
                if (userSelect.includes(key)) {
                    userSelect = userSelect.filter(k => k !== key);
                    item.classList.remove('selected');
                    item.querySelector('input').checked = false;
                } else {
                    userSelect.push(key);
                    item.classList.add('selected');
                    item.querySelector('input').checked = true;
                }
            }
            document.getElementById('main-btn').disabled = userSelect.length === 0;
        }

        function handleButtonClick() {
            if (!isAnswered) check();
            else next();
        }

        function check() {
            isAnswered = true;
            const q = quizData[currentQ];
            const isCorrect = userSelect.sort().join() === q.correct.sort().join();
            
            const feedback = document.getElementById('feedback-container');
            feedback.style.display = 'block';
            
            if (isCorrect) {
                score++;
                feedback.innerHTML = '<span class="res-correct">Правильно!</span>';
            } else {
                feedback.innerHTML = '<span class="res-wrong">Неправильно.</span>';
                errors.push({
                    q: q.question,
                    user: userSelect.map(k => `${k}) ${q.options[k]}`).join(', '),
                    correct: q.correct.map(k => `${k}) ${q.options[k]}`).join(', ')
                });
            }
            
            document.querySelectorAll('.option-item').forEach(el => {
                const val = el.querySelector('input').id;
                if (q.correct.includes(val)) el.classList.add('correct');
                else if (userSelect.includes(val)) el.classList.add('incorrect');
            });
            
            document.getElementById('main-btn').innerText = (currentQ < quizData.length - 1) ? "Наступне" : "Завершити";
        }

        function next() {
            currentQ++;
            if (currentQ < quizData.length) loadQ();
            else showResult();
        }

        function showResult() {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';
            document.getElementById('score-text').innerHTML = `<h3>Ваш рахунок: ${score} з ${quizData.length}</h3>`;
            
            const review = document.getElementById('error-review');
            if (errors.length > 0) {
                review.innerHTML = '<h4>Огляд помилок:</h4>';
                errors.forEach(err => {
                    review.innerHTML += `
                        <div class="result-item">
                            <p><strong>${err.q}</strong></p>
                            <p class="res-wrong">Ви: ${err.user || 'нічого'}</p>
                            <p class="res-correct">Правильно: ${err.correct}</p>
                        </div>
                    `;
                });
            }
        }
        loadQ();
    </script>
